name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies — npm install is intentionally skipped.
      - name: Run smoke tests
        run: npm test

      # docs/**, lang-*.html and the DOC_PAGES tail of sitemap.xml are
      # generated by the two build scripts. Regenerate and fail on drift.
      - name: Generated pages are up to date
        run: |
          node build_lang_pages.js
          node build_doc_pages.js
          changed="$(git status --porcelain -- docs 'lang-*.html' sitemap.xml)"
          if [ -n "$changed" ]; then
            echo "::error::Generated pages are out of sync. Run 'npm run build:pages' and commit the result."
            echo "$changed"
            git diff --stat -- docs 'lang-*.html' sitemap.xml | tail -20
            exit 1
          fi
